name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check src/main.ts scripts/hash-password.ts

      - name: Test
        run: deno test --allow-read --allow-write --allow-env --allow-net

      # Proves the deploy path still works: the Fedora installer ships a
      # compiled binary, so a compile failure must break CI, not the release.
      - name: Compile
        run: |
          deno compile \
            --allow-net \
            --allow-read=/var/lib/shorturl \
            --allow-write=/var/lib/shorturl \
            --allow-env \
            --output /tmp/shorturl \
            src/main.ts
